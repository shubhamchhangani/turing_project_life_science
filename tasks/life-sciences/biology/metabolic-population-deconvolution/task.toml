schema_version = "1.4"
artifacts = ["/root/results/fluxes.csv", "/root/results/pools.csv"]

[task]
name = "turing/metabolic-population-deconvolution"
description = "Recover two population-specific central-carbon flux maps and metabolite pool sizes from pooled, nonstationary isotope pulse-chase measurements across four tracer programs."
version = "1.0.0"
keywords = ["13c-mfa", "cell-population-heterogeneity", "pulse-chase", "metabolic-deconvolution", "systems-biology"]

[metadata]
domain = "life-sciences"
category = "biology"
subcategory = "systems-biology"
reward_type = "binary"
source = "original"
public_overlap = false

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 10240

[agent]
timeout_sec = 18000
network_mode = "public"

[verifier]
timeout_sec = 120
network_mode = "no-network"
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 1
memory_mb = 2048
