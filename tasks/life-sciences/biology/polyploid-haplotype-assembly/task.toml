schema_version = "1.4"
artifacts = ["/root/results/haplotypes.csv"]

[task]
name = "turing/polyploid-haplotype-assembly"
description = "Assemble sixteen homologous chromosome phases from noisy overlapping DNA reads and known allele dosages."
version = "1.0.0"
keywords = ["polyploidy", "haplotype-assembly", "DNA-sequencing", "weighted-MEC"]

[metadata]
domain = "life-sciences"
category = "biology"
subcategory = "computational-genomics"
reward_type = "binary"
source = "original"
public_overlap = false

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 10240

[agent]
timeout_sec = 18000
network_mode = "public"

[verifier]
timeout_sec = 120
network_mode = "no-network"
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 1
memory_mb = 2048
