schema_version = "1.4"
artifacts = ["/root/results/evidence.csv", "/root/results/division_posterior.csv", "/root/results/daughter_rna.csv", "/root/results/transcription_counts.csv"]

[task]
name = "turing/lineage-photon-inference"
description = "Infer hidden gene-expression states and transcription histories from integrated fluorescence across a cell division."
version = "1.0.0"
keywords = ["systems-biology", "stochastic-gene-expression", "cell-lineage", "bayesian-smoothing"]

[metadata]
domain = "life-sciences"
category = "biology"
subcategory = "systems-biology"
reward_type = "binary"
source = "original"
public_overlap = false

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 10240

[agent]
timeout_sec = 18000
network_mode = "public"

[verifier]
timeout_sec = 120
network_mode = "no-network"
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 1
memory_mb = 2048
