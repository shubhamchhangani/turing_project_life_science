schema_version = "1.4"
artifacts = ["/root/results/evidence.csv", "/root/results/read_posteriors.csv"]

[task]
name = "turing/polyploid-phase-posterior"
description = "Compute exact Bayesian phase uncertainty and read-error posteriors for a synthetic hexaploid chromosome."
version = "1.0.0"
keywords = ["polyploidy", "phase-uncertainty", "Bayesian-inference", "DNA-sequencing"]

[metadata]
domain = "life-sciences"
category = "biology"
subcategory = "computational-genomics"
reward_type = "binary"
source = "original"
public_overlap = false

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 10240

[agent]
timeout_sec = 18000
network_mode = "public"

[verifier]
timeout_sec = 120
network_mode = "no-network"
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 1
memory_mb = 2048
