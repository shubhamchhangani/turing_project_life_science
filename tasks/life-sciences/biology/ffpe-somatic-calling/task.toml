schema_version = "1.4"
artifacts = ["/root/results/somatic_snvs.tsv", "/root/results/sample_estimates.json"]

[task]
name = "turing/ffpe-somatic-calling"
description = "Call somatic SNVs and estimate tumour purity, ploidy and tumour-in-normal fraction from an FFPE whole-genome-doubled lymphoma and a tumour-contaminated blood normal."
version = "1.0.4"
keywords = ["somatic-variant-calling", "ffpe-artifacts", "tumor-in-normal", "copy-number", "purity-ploidy", "cancer-genomics"]

[metadata]
domain = "life-sciences"
category = "biology"
subcategory = "cancer-genomics"
reward_type = "binary"
source = "original"
public_overlap = false

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 10240

[agent]
timeout_sec = 18000
network_mode = "public"

[verifier]
timeout_sec = 120
network_mode = "no-network"
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 1
memory_mb = 2048
