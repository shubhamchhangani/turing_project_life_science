schema_version = "1.4"
artifacts = ["/root/results/joint.csv", "/root/results/thermodynamics.csv"]

[task]
name = "turing/receptor-cluster-thermodynamics"
description = "Compute the equilibrium joint activity distribution of six probes in a heterogeneous, periodic, cooperative membrane-receptor lattice."
version = "1.0.0"
keywords = ["membrane-biophysics", "receptor-cooperativity", "statistical-mechanics", "finite-size-thermodynamics"]

[metadata]
domain = "life-sciences"
category = "biology"
subcategory = "computational-biophysics"
reward_type = "binary"
source = "original"
public_overlap = false

[environment]
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 10240

[agent]
timeout_sec = 18000
network_mode = "public"

[verifier]
timeout_sec = 900
network_mode = "no-network"
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 1
memory_mb = 2048
